name: Bulk add papers to repository

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      identifiers:
        description: Newline-separated list of DOIs
        required: true
      preview_only:
        description: true=don’t update datasets, just validate
        required: true
        default: 'true'
  issues:
    types: [opened, reopened]

jobs:
  bulk-add:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        startsWith(github.event.issue.title, '[Paper ingest]') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve request inputs
        id: request
        run: |
          node <<'NODE'
          const fs = require('fs');

          const event = JSON.parse(
            fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
          );

          let identifiers = '';
          let previewOnly = 'true';

          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            identifiers = String(event.inputs?.identifiers ?? '').trim();
            previewOnly = String(event.inputs?.preview_only ?? 'true').trim();
          } else {
            const body = String(event.issue?.body ?? '');
            const heading = /^### DOI\(s\)\s*$/m;
            const match = heading.exec(body);

            if (!match) {
              throw new Error('Unable to find the DOI(s) field in the issue body.');
            }

            const afterHeading = body
              .slice(match.index + match[0].length)
              .replace(/^\r?\n+/, '');
            const nextHeading = afterHeading.search(/^### /m);

            identifiers = (
              nextHeading === -1
                ? afterHeading
                : afterHeading.slice(0, nextHeading)
            ).trim();
            previewOnly = 'false';
          }

          if (!identifiers || identifiers === '_No response_') {
            throw new Error('No DOI was supplied.');
          }

          const delimiter = `DOI_INPUT_${Date.now()}`;
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `identifiers<<${delimiter}`,
              identifiers,
              delimiter,
              `preview_only=${previewOnly}`,
              ''
            ].join('\n')
          );
          NODE

      - name: Acknowledge issue request
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks — the DOI is being fetched and validated. This issue will be updated with the pull request link.'
            });

      - name: Check PR automation token availability
        env:
          PR_AUTOMATION_TOKEN: ${{ secrets.ACTIONS_PR_TOKEN }}
        run: |
          if [ -z "$PR_AUTOMATION_TOKEN" ]; then
            echo "::warning::The ACTIONS_PR_TOKEN secret is not configured. Falling back to the workflow GITHUB_TOKEN."
            echo "::notice::Add a fine-grained personal access token with Contents: Read & Write and Pull requests: Read & Write scopes to secrets as ACTIONS_PR_TOKEN so workflows can open pull requests without additional repository settings."
            echo "::notice::Alternatively, enable the repository setting 'Allow GitHub Actions to create and approve pull requests' to allow the fallback token to create PRs."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (runtime only)
        run: npm ci --omit=dev

      - name: Prepare DOI list
        id: doi_inputs
        env:
          IDENTIFIERS: ${{ steps.request.outputs.identifiers }}
        run: |
          set -euo pipefail

          # IDENTIFIERS comes in as a single string.
          sanitized=$(printf '%s\n' "$IDENTIFIERS")

          # Convert commas, spaces, and tabs into newlines, trim, and drop empty lines.
          mapfile -t dois < <(
            printf '%s\n' "$sanitized" \
              | tr ',\t ' '\n' \
              | sed 's/^[ \t]*//;s/[ \t]*$//' \
              | awk 'length>0'
          )

          if [ "${#dois[@]}" -eq 0 ]; then
            echo "No DOIs provided" >&2
            exit 1
          fi

          doi_file="$RUNNER_TEMP/bulk_add_dois.txt"
          printf '%s\n' "${dois[@]}" > "$doi_file"

          {
            echo "count=${#dois[@]}"
            printf 'file=%s\n' "$doi_file"
            printf 'first=%s\n' "${dois[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Run bulk add:paper
        id: bulk_add
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PREVIEW_ONLY: ${{ steps.request.outputs.preview_only }}
          DOI_FILE: ${{ steps.doi_inputs.outputs.file }}
        run: |
          set -uo pipefail
          preview=$(printf '%s\n' "$PREVIEW_ONLY" | tr '[:upper:]' '[:lower:]')
          doi_file="$DOI_FILE"
          if [ ! -f "$doi_file" ]; then
            echo "Unable to locate DOI list file" >&2
            exit 1
          fi
          successes=()
          failures=()
          while IFS= read -r doi; do
            [ -z "$doi" ] && continue
            echo "Adding DOI: $doi"
            # Ensure npm does not consume the loop's stdin so all DOIs are processed.
            if npm run add:paper -- --doi "$doi" --preview "$preview" < /dev/null; then
              successes+=("$doi")
            else
              echo "::error::Failed to add DOI: $doi" >&2
              failures+=("$doi")
            fi
          done < "$doi_file"

          success_count=${#successes[@]}
          failure_count=${#failures[@]}

          {
            echo "## Bulk add summary"
            echo
            echo "Processed DOIs: $((success_count + failure_count))"
            echo
            echo "### Successful ($success_count)"
            for doi in "${successes[@]}"; do
              echo "- $doi"
            done
            if [ "$success_count" -eq 0 ]; then
              echo "- none"
            fi
            echo
            echo "### Failed ($failure_count)"
            if [ "$failure_count" -eq 0 ]; then
              echo "- none"
            else
              for doi in "${failures[@]}"; do
                echo "- $doi"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$success_count" -eq 0 ]; then
            echo "No DOIs were processed successfully." >&2
            exit 1
          fi

          {
            printf 'success_count=%s\n' "$success_count"
            printf 'failure_count=%s\n' "$failure_count"
            printf 'success_bullets<<EOF\n'
            for doi in "${successes[@]}"; do
              printf -- '- %s\n' "$doi"
            done
            printf 'EOF\n'
            printf 'failure_bullets<<EOF\n'
            if [ "$failure_count" -eq 0 ]; then
              printf -- '- none\n'
            else
              for doi in "${failures[@]}"; do
                printf -- '- %s\n' "$doi"
              done
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Report failed DOIs
        if: steps.bulk_add.outputs.failure_count != '0'
        run: |
          echo "The following DOIs could not be ingested:" >&2
          printf '%s\n' "${{ steps.bulk_add.outputs.failure_bullets }}" >&2

      - name: Create PR with changes
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ACTIONS_PR_TOKEN || github.token }}
          commit-message: 'chore: bulk add ${{ steps.bulk_add.outputs.success_count }} papers'
          branch: chore/bulk-add-papers-${{ github.run_id }}
          title: 'Bulk add papers (${{ steps.bulk_add.outputs.success_count }})'
          body: |
            Automated bulk addition.
            Preview=${{ steps.request.outputs.preview_only }}
            Successfully processed:
            ${{ steps.bulk_add.outputs.success_bullets }}

            Failed lookups:
            ${{ steps.bulk_add.outputs.failure_bullets }}
          delete-branch: true

      - name: Link pull request and close issue
        if: >-
          github.event_name == 'issues' &&
          steps.create_pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
        with:
          script: |
            const number = process.env.PR_NUMBER;
            const url = process.env.PR_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Paper data fetched successfully. Pull request [#${number}](${url}) has been created for review.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Close issue when no changes were needed
        if: >-
          github.event_name == 'issues' &&
          success() &&
          steps.create_pr.outputs.pull-request-number == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'No pull request was created because the DOI produced no repository changes. It may already be present in the dataset.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Report issue processing failure
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `The DOI could not be processed automatically. Please review the [workflow run](${runUrl}) for details. The issue has been left open.`
            });
