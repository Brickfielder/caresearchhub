<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Submit a paper to CARESearch</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(34rem,calc(100% - 2rem))}label,input,button{display:block;width:100%;box-sizing:border-box}label{margin-top:1rem;font-weight:700}input,button{font:inherit;padding:.75rem;margin-top:.35rem}button{margin-top:1.25rem;background:#0f766e;color:#fff;border:0;border-radius:.5rem;font-weight:700;cursor:pointer}.message{min-height:1.5rem}</style></head>
  <body><main><h1>Submit a paper to CARESearch</h1><p id="intro">Confirm your email once on this browser, then submit a detected DOI for review.</p><form id="form"><label id="email-label">Email address<input id="email" type="email" required autocomplete="email" /></label><label>DOI<input id="doi" required /></label><button id="button" type="submit">Send verification link</button></form><p class="message" id="message" role="status"></p><script>const q=new URLSearchParams(location.search),form=document.querySelector('#form'),email=document.querySelector('#email'),doi=document.querySelector('#doi'),button=document.querySelector('#button'),message=document.querySelector('#message'),verified=q.has('verified');doi.value=q.get('doi')||'';if(verified){document.querySelector('#email-label').hidden=true;document.querySelector('#intro').textContent='Your browser is confirmed. Submit this DOI for review.';button.textContent='Submit for review';}form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='';const endpoint=verified?'/api/submit':'/api/request-link';const body=verified?{doi:doi.value}:{email:email.value,doi:doi.value};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();message.textContent=data.ok?(verified?'Submitted. CARESearch will create a pull request for review.':'Check your email and open the confirmation link.'):data.error;button.disabled=false;});</script></main></body>
</html>
